# vim: ts=2
---
- hosts: all
  remote_user: vagrant
  become: yes
  become_method: sudo
    
  
  vars:
    vHome: /home/vagrant
      
  tasks:

  - include_role:
      name: gitlab

  - include_role:
      name: docker

  - include_role:
      name: nmap

  - include_role:
      name: gitlab-runner

  post_tasks:

  - name: "Show GitLab credentials."
    debug:
      msg: "{{ gitlab_credentials_summary }}"
