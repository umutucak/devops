---

- name: Update repositories cache. 
  apt:
    update_cache: yes

- name: Safe system upgrade via aptitude.
  apt: 
    upgrade: safe


- name: Install packages required by Docker.
  apt:
    name: "{{ packages }}"
  vars:
    packages:
    - apt-transport-https
    - ca-certificates
    - curl
    - software-properties-common


- name: Add Docker GPG apt Key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker Repository
  apt_repository:
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    state: present

- name: Update repositories cache. 
  apt:
    update_cache: yes    

    
- name: Install Docker packages. 
  apt:
    name: "{{ dockerpackages }}"
  vars:
    dockerpackages:
    - docker-ce 
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    
    
- name: Add users to docker group. 
  shell: "usermod -aG docker {{ item }}"
  with_items:
    - vagrant


- name: "Docker validation: run the hello-world container."
  command: "docker run --name hello-world hello-world"
  register: hello_world

- name: "Docker validation: assert the 'Hello from Docker!' banner."
  assert:
    that:
      - "'Hello from Docker!' in hello_world.stdout"
    fail_msg: "hello-world did not print the expected banner. Got: {{ hello_world.stdout }}"
    success_msg: "OK: docker CLI works — saw 'Hello from Docker!'"

- name: "Docker validation: remove the hello-world container."
  command: "docker rm hello-world"

- name: "Docker validation: remove the hello-world image."
  command: "docker rmi hello-world"
