---

- name: "Load vault-encrypted secrets (gitlab_root_password, gitlab_developer_password)."
  include_vars:
    file: "{{ role_path }}/defaults/secrets.yml"

- name: "Create Downloads folder"
  file:
    path: "{{ destination }}"
    state: directory

- name: "Update repositories cache." 
  apt:
    update_cache: yes


- name: "Safe system upgrade via aptitude."
  apt: 
    upgrade: safe        


- name: "Check if GitLab configuration file already exists."
  stat: path=/etc/gitlab/gitlab.rb
  register: gitlab_config_file


- name: "Check if GitLab is already installed."
  stat: path=/usr/bin/gitlab-ctl
  register: gitlab_file


- name: "Install GitLab dependencies."
  package: name={{ item }} state=present
  with_items:
    - openssh-server
    - ca-certificates
    - curl
    - openssl
    - tzdata

    
- name: "Download GitLab repository installation script."
  get_url:
    url: "{{ gitlab_repository_installation_script_url }}"
    dest: /tmp/gitlab_install_repository.sh
    validate_certs: "{{ gitlab_download_validate_certs }}"
  when: not gitlab_file.stat.exists
  

- name: "Install GitLab repository."
  command: bash /tmp/gitlab_install_repository.sh
  when: not gitlab_file.stat.exists
  

- name: "Define the Gitlab package name."
  set_fact:
    gitlab_package_name: "{{ gitlab_edition }}{{ gitlab_package_version_separator }}{{ gitlab_version }}"
  when: gitlab_version != ''


- name: "Install GitLab"
  package:
    name: "{{ gitlab_package_name | default(gitlab_edition) }}"
    state: present
  when: not gitlab_file.stat.exists

- name: "Set GitLab external_url."
  lineinfile:
    path: /etc/gitlab/gitlab.rb
    regexp: "external_url"
    line: "external_url '{{ gitlab_external_url }}'"
    state: present
  when: gitlab_config_file.stat.exists

- name: "Set GitLab puma port."
  lineinfile:
    path: /etc/gitlab/gitlab.rb
    regexp: "puma\\['port'\\]"
    line: "puma['port'] = {{ gitlab_puma_port }}"
    state: present
  when: gitlab_config_file.stat.exists

- name: "Reconfigure GitLab."
  command: gitlab-ctl reconfigure
  when: gitlab_file.stat.exists

  # this also restarts puma, so we can skip that step
- name: "Restart GitLab."
  command: gitlab-ctl restart
  when: gitlab_file.stat.exists


  # this ruby one-liner code was written with glm-5.3-flash. explanation:
  # u = User.find_by_username('root'); pulls the user record for root from gitlab db
  # u.password = ENV['GITLAB_ROOT_PASSWORD']; ----------------|
  # u.password_confirmation = ENV['GITLAB_ROOT_PASSWORD'];----|-----> write new password for root user in memory. why? because gitlab's assigned root pass is wiped after 24h, so we set it ourselves. + always have the same root pass
  # u.password_automatically_set = false; tags it as a human-set password, removes "auto-assigned" banner
  # u.save! actually writes it into db
- name: "Set the admin (root) password."
  command:
    argv:
      - gitlab-rails
      - runner
      - "u = User.find_by_username('root'); u.password = ENV['GITLAB_ROOT_PASSWORD']; u.password_confirmation = ENV['GITLAB_ROOT_PASSWORD']; u.password_automatically_set = false; u.save!"
  environment:
    GITLAB_ROOT_PASSWORD: "{{ gitlab_root_password }}"
  changed_when: false   # converging to the same value on every run
  when: gitlab_file.stat.exists

  # this bash command was written with glm-5.3-flash
- name: "Create the developer user (idempotent)."
  shell: |
    set -e
    u=$(gitlab-rails runner "puts User.find_by_username('{{ gitlab_developer_username }}')&.id" 2>/dev/null)
    if [ -z "$u" ]; then
      export GITLAB_DEV_PASSWORD='{{ gitlab_developer_password }}'
      gitlab-rails runner "
        User.create!(
          username: '{{ gitlab_developer_username }}',
          email:    '{{ gitlab_developer_email }}',
          name:     'Developer',
          password: ENV['GITLAB_DEV_PASSWORD'],
          skip_confirmation: true
        )
      "
      echo created
    else
      echo exists
    fi
  register: gitlab_developer_create
  changed_when: "'created' in gitlab_developer_create.stdout"
  when: gitlab_file.stat.exists

- name: "Collect credentials for the final summary."
  set_fact:
    gitlab_credentials_summary:
      - "GitLab is ready at {{ gitlab_external_url }}"
      - "root       credential: root    password: {{ gitlab_root_password }}"
      - "developer credentials: {{ gitlab_developer_username }}    password: {{ gitlab_developer_password }}"
