---

- name: "Load runner secrets (vault-encrypted)."
  include_vars:
    file: "{{ role_path }}/defaults/secrets.yml"

- name: "Update repositories cache."
  apt:
    update_cache: yes

- name: "Add GitLab Runner apt repository."
  # shell (not command): the pipe needs a shell; the script now writes
  # runner_gitlab-runner.list (old name was gitlab_runner.list)
  shell: curl -sL "{{ gitlab_runner_repo_script }}" | bash
  args:
    # "if a matching file already exsists, this step will not be run"
    # https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/command_module.html#parameter-creates
    creates: /etc/apt/sources.list.d/runner_gitlab-runner.list

- name: "Install GitLab Runner."
  apt:
    name: gitlab-runner
    state: present

- name: "Check whether a runner is already registered."
  command: grep -qF "[[runners]]" /etc/gitlab-runner/config.toml
  register: register_check
  failed_when: false
  changed_when: false

- name: "Register the GitLab Runner (non-interactive)."
  # --non-interactive: gitlab-runner 19 prompts per-field without it (hangs under ansible)
  # no --tag-list: reserved server-side for glrt- tokens (set at runner creation)
  command: >
    gitlab-runner register
    --non-interactive
    --url "{{ gitlab_runner_url }}"
    --token "{{ gitlab_runner_token }}"
    --description "{{ gitlab_runner_description }}"
    --executor "{{ gitlab_runner_executor }}"
    --docker-image "{{ gitlab_runner_image }}"
  when: register_check.rc != 0

- name: "Ensure GitLab Runner service is running (already registered)."
  service:
    name: gitlab-runner
    state: started
  when: register_check.rc == 0

- name: "Restart GitLab Runner to apply the new registration."
  service:
    name: gitlab-runner
    state: restarted
  when: register_check.rc != 0

- name: "Check for GitLab Runner config."
  stat:
    path: /etc/gitlab-runner/config.toml
  register: runner_config

  # run_untagged_jobs is managed server-side in the glrt- token workflow
  # (defaults to true), so no config.toml edit is needed.

- name: "Verify GitLab Runner configuration."
  command: gitlab-runner verify
  when: runner_config.stat.exists
  changed_when: false
